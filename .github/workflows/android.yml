name: Android APK

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci --no-audit --no-fund --loglevel=error

      - run: npm run cap:sync

      # versionCode/versionName sont dérivés de BUILD_NUMBER dans android/app/build.gradle :
      # versionCode = run_number, versionName = <appVersionBase>.<run_number>. Les deux augmentent à
      # chaque run ; le tag de release est v<versionName> (ex. v1.0.152), toujours supérieur au précédent
      # (un tag « v1.0-25 » serait lu comme une pré-version < 1.0 et n'enclencherait jamais de mise à jour).
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep '^appVersionBase=' android/gradle.properties | cut -d= -f2)
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -q

      # Gradle nomme toujours sa sortie "app-debug.apk" (nom fixe lié au
      # buildType), quelle que soit la version : on la renomme pour que le
      # fichier téléchargé (artifact ou asset de release) porte la version
      # au lieu d'un nom générique identique à chaque run.
      - name: Renommer l'APK avec sa version
        id: apk
        run: |
          NAME="Vizuzik-${{ steps.version.outputs.name }}.apk"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/$NAME"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: vizuzik-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      # Vraie release GitHub, versionnée et permanente : seulement pour main,
      # jamais écrasée (chaque run a une version unique), pas marquée
      # "Pre-release". Toujours signée avec la clé debug committée (pas de
      # clé de production configurée) : à faire évoluer le jour où on distribue
      # via le Play Store ou en dehors des testeurs internes.
      - name: Publier la release GitHub (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<EOF
          ## Vizuzik $TAG

          Run #${{ github.run_number }} (${{ github.sha }}). APK signé avec la clé debug committée (pas de clé de production), identique pour tous les builds.

          ### Installation

          - **Vizuzik est déjà installé** : ouvrez l'app. Elle vérifie les mises à jour à chaque ouverture : touchez « Installer », autorisez l'installation d'applications inconnues si Android le demande, puis confirmez « Mettre à jour ». Vos réglages sont conservés. Vous pouvez aussi toucher « Rechercher une mise à jour » dans les réglages (engrenage).
          - **Première installation (manuelle)** : téléchargez \`${{ steps.apk.outputs.name }}\` ci-dessous, ouvrez-le, autorisez la source si Android bloque l'installation (Réglages → Installer des applications inconnues), puis touchez « Installer ». Les mises à jour suivantes seront proposées dans l'app.
          EOF
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Vizuzik $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      # Les artifacts d'Actions sont hébergés sur Azure Blob Storage, souvent
      # bloqué par des politiques réseau restrictives. Une release GitHub
      # (objects.githubusercontent.com) reste accessible dans ces cas et sert
      # de lien stable pour installer le dernier APK debug. Un tag par branche
      # évite qu'un build staging n'écrase le dernier build main (ou l'inverse).
      # Réservé à staging/PR/dispatch : main a sa vraie release ci-dessus.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK debug en release GitHub
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Vizuzik — APK debug (${{ steps.reltag.outputs.branch }})" \
            --notes "Build automatique non signé, run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
