apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Numéro de build : run_number de la CI (BUILD_NUMBER) ; versionCode ET tag de release en dérivent, donc
// ils augmentent strictement à chaque build (Android refuse une mise à jour sinon).
def buildNumber = ((System.getenv('BUILD_NUMBER') ?: project.findProperty('buildNumber')) ?: '1').toString().toInteger()
def appVersionBase = project.property('appVersionBase')

android {
    namespace = "com.vizuzik.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vizuzik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Fixés par la CI via BUILD_NUMBER (= github.run_number) : un APK = une version unique et croissante.
        versionCode buildNumber
        versionName "${appVersionBase}.${buildNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé debug FIXE, committée dans le repo (android/app/debug.keystore).
    // Sans ça, chaque runner CI neuf régénère sa propre clé debug aléatoire,
    // et deux builds successifs sont alors signés différemment, empêchant
    // d'installer la mise à jour par-dessus l'ancienne. Une clé debug n'a
    // rien de secret (mot de passe "android" documenté par Google) : la
    // committer est la pratique standard pour des builds CI reproductibles.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Mises à jour automatiques depuis les releases GitHub (dépôt Maven vendoré : android/libs/lielugit-maven).
    implementation "com.lielu:lielugit-updater:1.0.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7" // lifecycleScope / repeatOnLifecycle (UpdateDialogs)
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
