apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace = "com.vizuzik.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.vizuzik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Surchargeable en CI via -PvizuzikVersionCode=N -PvizuzikVersionName=X.Y.N
        // pour que chaque release GitHub porte une version unique et croissante.
        versionCode project.hasProperty('vizuzikVersionCode') ? (vizuzikVersionCode as int) : 1
        versionName project.hasProperty('vizuzikVersionName') ? vizuzikVersionName : "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Clé debug FIXE, committée dans le repo (android/app/debug.keystore).
    // Sans ça, chaque runner CI neuf régénère sa propre clé debug aléatoire,
    // et deux builds successifs sont alors signés différemment, empêchant
    // d'installer la mise à jour par-dessus l'ancienne. Une clé debug n'a
    // rien de secret (mot de passe "android" documenté par Google) : la
    // committer est la pratique standard pour des builds CI reproductibles.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/LICENSE*', '/META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:$rootProject.ext.coreKtxVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$rootProject.ext.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-service:$rootProject.ext.lifecycleVersion"
    implementation "androidx.activity:activity-compose:$rootProject.ext.activityComposeVersion"
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Compose
    implementation platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    androidTestImplementation platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Navigation
    implementation "androidx.navigation:navigation-compose:$rootProject.ext.navigationComposeVersion"
    implementation "androidx.hilt:hilt-navigation-compose:$rootProject.ext.hiltNavigationComposeVersion"

    // Hilt
    implementation "com.google.dagger:hilt-android:$rootProject.ext.hiltVersion"
    kapt "com.google.dagger:hilt-compiler:$rootProject.ext.hiltVersion"

    // Room
    implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
    implementation "androidx.room:room-ktx:$rootProject.ext.roomVersion"
    kapt "androidx.room:room-compiler:$rootProject.ext.roomVersion"

    // Preferences (thème, tri, dernier scan)
    implementation "androidx.datastore:datastore-preferences:$rootProject.ext.datastoreVersion"

    // Media3 / ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-session:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-common:$rootProject.ext.media3Version"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.coroutinesVersion"

    // Chargement des pochettes (cache mémoire/disque, décodage économe)
    implementation "io.coil-kt:coil-compose:$rootProject.ext.coilVersion"

    // Tests unitaires (JVM)
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutinesVersion"

    // Tests instrumentés
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

kapt {
    correctErrorTypes true
}
