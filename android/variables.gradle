// Versions centralisées du projet. Toutes des versions stables connues au
// moment du développement (le dépôt ne dispose pas d'un accès réseau fiable
// pendant le développement pour vérifier l'existence de versions plus récentes) ;
// à monter vers la dernière version stable lors d'une prochaine itération.
ext {
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36

    // 2.0.21 (pas 2.1.x) : kapt embarque une kotlinx-metadata-jvm qui ne lit
    // pas le format de métadonnées 2.1.0 (voir AnnotationProcessingError sur
    // room-compiler/hilt-compiler).
    kotlinVersion = '2.0.21'

    composeBomVersion = '2024.12.01'
    coreKtxVersion = '1.15.0'
    lifecycleVersion = '2.8.7'
    activityComposeVersion = '1.9.3'
    navigationComposeVersion = '2.8.4'

    hiltVersion = '2.52'
    hiltNavigationComposeVersion = '1.2.0'

    roomVersion = '2.6.1'
    datastoreVersion = '1.1.1'

    media3Version = '1.5.0'
    coroutinesVersion = '1.9.0'
    coilVersion = '2.7.0'

    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
}
