<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vizuzik</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="background" class="background"></div>

    <main id="player" class="player" hidden>
      <div id="cover-wrap" class="cover-wrap" data-mode="cover">
        <div id="cover" class="cover"></div>
        <canvas id="visualizer" class="visualizer"></canvas>
        <button id="capture-status" type="button" class="capture-status" hidden></button>
        <button id="mode-toggle" class="mode-toggle" aria-label="Changer l'affichage (pochette / barres / radial)">
          <svg class="icon-cover" viewBox="0 0 24 24"><path d="M4 5h16v14H4zm2 2v10h12V7zm2 8 3-4 2 2.5L15 9l3 6z" /></svg>
          <svg class="icon-bars" viewBox="0 0 24 24"><path d="M5 10h2v9H5zm4-5h2v14H9zm4 3h2v11h-2zm4-6h2v17h-2z" /></svg>
          <svg class="icon-radial" viewBox="0 0 24 24"><path d="M12 2l2.1 6.5L21 11l-6.9 2.5L12 20l-2.1-6.5L3 11l6.9-2.5L12 2z" /></svg>
        </button>
      </div>
      <h1 id="title" class="title"></h1>
      <p id="artist" class="artist"></p>

      <div class="controls">
        <button id="previous" class="control control--secondary" aria-label="Précédent">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
        </button>
        <button id="play-pause" class="control control--primary" data-state="paused" aria-label="Lecture / Pause">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
        </button>
        <button id="next" class="control control--secondary" aria-label="Suivant">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" /></svg>
        </button>
      </div>
    </main>

    <section id="empty" class="empty" hidden>
      <p>Aucune lecture Deezer en cours.</p>
      <p class="hint">Lance un titre dans l'app Deezer.</p>
    </section>

    <section id="permission" class="permission" hidden>
      <p>Vizuzik a besoin de l'accès aux notifications pour afficher et contrôler la lecture Deezer.</p>
      <button id="grant-access" class="grant-button">Autoriser l'accès</button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
